# Infrastructure:  docker compose up -d
# Full stack:      docker compose --profile apps up -d --build   (after ./mvnw -B package -DskipTests)
x-service: &service
  profiles: ["apps"]
  restart: on-failure
x-jvm: &jvm
  JAVA_TOOL_OPTIONS: "-Xms128m -Xmx${JVM_HEAP:-256m} -XX:+UseG1GC"
  KAFKA_BOOTSTRAP: kafka:19092
  REDIS_HOST: redis
  DATABASE_URL: jdbc:postgresql://postgres:5432/shop

services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 20

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: shop
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "shop", "-d", "shop"]
      interval: 2s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:19092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 4
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list"]
      interval: 3s
      retries: 30

  order:
    <<: *service
    build: {context: ., dockerfile: order-service/Dockerfile}
    environment:
      <<: *jvm
      INVENTORY_URL: http://inventory:8082
      CACHE_ENABLED: ${CACHE_ENABLED:-true}
    ports: ["8081:8081"]
    depends_on: &deps
      kafka: {condition: service_healthy}
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}

  inventory:
    <<: *service
    build: {context: ., dockerfile: inventory-service/Dockerfile}
    environment: *jvm
    ports: ["8082:8082"]
    depends_on: *deps

  payment:
    <<: *service
    build: {context: ., dockerfile: payment-service/Dockerfile}
    environment: *jvm
    ports: ["8083:8083"]
    depends_on: *deps

  notification:
    <<: *service
    build: {context: ., dockerfile: notification-service/Dockerfile}
    environment: *jvm
    ports: ["8084:8084"]
    depends_on: *deps

  search:
    <<: *service
    build: {context: ., dockerfile: search-service/Dockerfile}
    environment: *jvm
    ports: ["8085:8085"]
    depends_on: *deps

  # Runs inside the Docker network, so results do not include the host port proxy.
  loadgen:
    profiles: ["tools"]
    image: eclipse-temurin:21-jdk
    volumes:
      - ./tools:/tools:ro
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    entrypoint: ["java", "/tools/LoadGen.java"]
